<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>کتابخانه سنی پلاستیک</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#23201b;--mut:#7a746a;--bd:#e4dfd4;--ac:#2f5d50;--ok:#1f7a4d;--okb:#e0f2e8;--no:#b4432f;--nob:#fbe6e1;--rs:#9a6a14;--rsb:#fbefd2;--r:14px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17191a;--card:#212425;--tx:#ece8df;--mut:#9b958a;--bd:#33373a;--ac:#6fb8a3;--ok:#6fd19b;--okb:#17352a;--no:#f08a76;--nob:#40201a;--rs:#e6bd62;--rsb:#3a2f12}}
:root[data-theme="dark"]{--bg:#17191a;--card:#212425;--tx:#ece8df;--mut:#9b958a;--bd:#33373a;--ac:#6fb8a3;--ok:#6fd19b;--okb:#17352a;--no:#f08a76;--nob:#40201a;--rs:#e6bd62;--rsb:#3a2f12}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Vazirmatn',Tahoma,sans-serif;line-height:1.7}
.w{max-width:1000px;margin:0 auto;padding:20px 16px 48px}
h1{margin:0;font-size:1.6rem}h2{font-size:1.05rem;margin:0 0 8px}.sub{color:var(--mut);margin:2px 0 14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.st,.box{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:10px}
.st{text-align:center}.st b{display:block;font-size:1.5rem}.st span{color:var(--mut);font-size:.8rem}
.box{padding:14px;margin-bottom:14px}
.notice{background:var(--rsb);color:var(--rs);border-radius:var(--r);padding:10px 14px;margin-bottom:14px;white-space:pre-line}
.two2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;width:100%}
.bar input,.bar select{background:var(--card)}
.bar input{flex:2 1 200px;width:auto}.bar select{flex:1 1 130px;width:auto}
button{cursor:pointer;border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:6px 12px}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button.d{color:var(--no)}
.info{font-size:.9rem;white-space:pre-line;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.c .b{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.c h3{margin:0;font-size:1.05rem}.au{color:var(--mut);font-size:.85rem}
.im{width:100%;height:170px;object-fit:cover;background:var(--bg);display:block}
.ph{height:80px;display:flex;align-items:center;justify-content:center;font-size:2rem;background:var(--bg)}
.tag{display:inline-block;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:0 10px;font-size:.75rem;color:var(--mut)}
.ds{font-size:.9rem;flex:1}
.bd{display:inline-block;border-radius:20px;padding:1px 12px;font-size:.8rem;font-weight:600}
.available{background:var(--okb);color:var(--ok)}.borrowed{background:var(--nob);color:var(--no)}.reserved{background:var(--rsb);color:var(--rs)}
.meta{font-size:.8rem;color:var(--mut)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ft{display:flex;gap:8px;margin-top:14px}
.lb{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--bd)}
.feat{display:flex;gap:14px;align-items:center}.feat img{width:110px;height:150px;object-fit:cover;border-radius:10px}
.empty{text-align:center;color:var(--mut);padding:30px 0}
dialog{border:1px solid var(--bd);border-radius:var(--r);background:var(--card);color:var(--tx);width:min(520px,94vw);max-height:90vh;padding:18px}
dialog::backdrop{background:#0008}
label{display:block;font-size:.85rem;margin:8px 0 2px;color:var(--mut)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
.adm{background:var(--rsb);color:var(--rs);border-radius:10px;padding:6px 12px;margin-bottom:12px;font-size:.85rem}
@media(max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}.two2{grid-template-columns:1fr}.feat img{width:80px;height:110px}}
.w{max-width:1100px}
.hd{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:14px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.hi{padding:10px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lg{width:38px;height:38px;border-radius:10px;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.85rem}
nav{display:flex;gap:2px;flex-wrap:wrap;margin-inline-start:auto}
nav button{border:0;background:none;padding:6px 12px;border-radius:8px;color:var(--mut)}nav button.on{background:var(--bg);color:var(--ac);font-weight:600}
.hero{padding:18px 4px 12px}.hero h1{font-size:1.8rem}
.cv{display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;padding:12px;font-size:.9rem;font-weight:600;line-height:1.5}
.im{height:150px}.dc{width:120px;height:170px;border-radius:10px;object-fit:cover;flex:none}
.c:hover{border-color:var(--ac)}
.tb{width:100%;border-collapse:collapse;font-size:.85rem}.tb th,.tb td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:right;vertical-align:top}.tb th{color:var(--mut);font-weight:600}
.ov{overflow-x:auto}.big{font-size:1.3rem}
ul.rl{margin:0;padding-inline-start:20px}
.grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.stats{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.dd{position:relative}.dd summary{cursor:pointer;list-style:none;padding:6px 12px;border:1px solid var(--bd);border-radius:8px}.dd summary::-webkit-details-marker{display:none}
.dm{position:absolute;inset-inline-end:0;top:110%;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:4px;display:flex;flex-direction:column;min-width:150px;z-index:9}.dm button{border:0;text-align:right;background:none}
button:disabled{opacity:.55;cursor:not-allowed}
.st{border-top:3px solid var(--ac);box-shadow:0 1px 2px rgba(0,0,0,.04)}.st b{font-size:1.5rem}.stk{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--bd)}.stk i{display:block;height:100%}
</style>
</head>
<body>
<div class="w"><div id="app"></div></div>
<dialog id="dlg"></dialog>
